<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日新闻 · INTENT Daily CN</title>
<link rel="alternate" type="application/rss+xml" title="每日新闻 RSS" href="./feed.xml">
<link rel="alternate" type="application/feed+json" title="每日新闻 JSON Feed" href="./feed.json">
<style>
  :root{--ink:#111827;--sub:#6b7280;--line:#e5e7eb;--blue:#1d4ed8;--bg:#f9fafb}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 64px}
  header{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;border-radius:14px;
         padding:26px 24px;box-shadow:0 8px 24px rgba(29,78,216,.22)}
  header h1{margin:0;font-size:26px;letter-spacing:.5px}
  header p{margin:8px 0 0;font-size:13px;opacity:.9}
  .links{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 26px}
  .links a{flex:1 1 150px;text-align:center;text-decoration:none;background:#fff;border:1px solid var(--line);
           border-radius:10px;padding:11px 12px;font-size:13.5px;color:var(--blue);font-weight:600}
  .links a:hover{border-color:#bfdbfe;background:#eff6ff}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;
        box-shadow:0 1px 3px rgba(17,24,39,.05)}
  .meta{color:var(--sub);font-size:12.5px;margin:0 0 4px}
  #content h3{margin:22px 0 6px;font-size:15px;color:var(--blue)}
  #content h4{margin:16px 0 6px;font-size:16px;line-height:1.5}
  #content h4 a{color:var(--ink);text-decoration:none}
  #content h4 a:hover{color:var(--blue);text-decoration:underline}
  #content img{max-width:100%;border-radius:8px;margin:0 0 8px}
  #content p{margin:0 0 6px}
  footer{margin-top:26px;color:var(--sub);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>每日新闻</h1>
    <p>国际要闻（BBC News / VOA / NBC）＋ AI 研究动态 · 北京时间每天 07:35 自动更新</p>
  </header>

  <div class="links">
    <a href="./feed.xml" type="application/rss+xml">订阅 RSS</a>
    <a href="./latest.md">今日 Markdown</a>
    <a href="./monthly/latest.md">月度回顾</a>
    <a href="https://github.com/EOVANS/INTENT-Daily-CN">GitHub 仓库</a>
  </div>

  <div class="card">
    <p class="meta" id="meta">正在加载最新一期…</p>
    <div id="content"></div>
  </div>

  <footer>INTENT Daily CN · 由 GitHub Actions 自动构建</footer>
</div>

<script>
fetch('./feed.xml', {cache: 'no-store'})
  .then(r => r.text())
  .then(txt => {
    const doc = new DOMParser().parseFromString(txt, 'application/xml');
    const ch = doc.querySelector('channel');
    const it = ch && ch.querySelector('item');
    if (!it) throw new Error('no item');
    document.getElementById('meta').textContent =
      it.querySelector('title').textContent + ' · 更新于 ' +
      (ch.querySelector('lastBuildDate') || {}).textContent;
    document.getElementById('content').innerHTML =
      it.querySelector('description').textContent;
  })
  .catch(() => {
    document.getElementById('meta').textContent =
      '暂时无法读取 feed.xml，请直接访问 RSS 链接或稍后刷新。';
  });
</script>
</body>
</html>
