name: Daily Feed Build

on:
  schedule:
    # 23:35 UTC = 07:35 Asia/Shanghai（次日）——主班
    - cron: "35 23 * * *"
    # 00:35 UTC = 08:35 CST —— 补跑一（GitHub 定时偶发延迟/漏跳）
    - cron: "35 0 * * *"
    # 02:35 UTC = 10:35 CST —— 补跑二
    - cron: "35 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard (skip if today's issue already built)
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          if [ -f "docs/daily/$TODAY.md" ]; then
            echo "today's issue exists, skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "no issue for $TODAY yet, build"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build daily feed
        if: steps.guard.outputs.skip != 'true'
        env:
          NEWS_WINDOW_HOURS: "26"
          AI_WINDOW_HOURS: "504"
          NEWS_TOP_N: "8"
          AI_TOP_N: "5"
        run: python scripts/pipeline.py

      - name: Commit generated feed
        if: always()
        run: |
          git config user.name "INTENT Daily CN Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs archive
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "feed: $(TZ=Asia/Shanghai date +%Y-%m-%d) 每日新闻 + AI 研究"
            git push
          fi

      - name: Purge jsDelivr cache
        if: steps.guard.outputs.skip != 'true'
        run: |
          for p in docs/feed.xml docs/latest.md docs/latest.json; do
            curl -s -m 20 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$p" > /dev/null && echo "purged $p" || true
          done
