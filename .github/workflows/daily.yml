name: Daily Feed Build

on:
  schedule:
    # 全部为 UTC；北京时间 = UTC+8
    # 07:35 CST / 08:35 / 09:35 / 10:35 / 11:35 —— 五个时点互为兜底
    - cron: "35 23 * * *"
    - cron: "35 0 * * *"
    - cron: "35 1 * * *"
    - cron: "35 2 * * *"
    - cron: "35 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard (skip unless a build is still needed today)
        id: guard
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          HOUR=$(TZ=Asia/Shanghai date +%H)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "non-schedule event -> build"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 北京时间 07:00 之前不生成当天的期刊（避免午夜抢先生成一堆前一天的旧闻）
          if [ "$HOUR" -lt 7 ]; then
            echo "before 07:00 CST, skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "docs/daily/$TODAY.md" ]; then
            echo "today's issue already exists, skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "no issue for $TODAY yet, build"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build daily feed
        if: steps.guard.outputs.skip != 'true'
        env:
          NEWS_WINDOW_HOURS: "26"
          AI_WINDOW_HOURS: "504"
          NEWS_TOP_N: "8"
          AI_TOP_N: "5"
        run: python scripts/pipeline.py

      - name: Commit generated feed
        if: always()
        run: |
          git config user.name "INTENT Daily CN Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs archive
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "feed: $(TZ=Asia/Shanghai date +%Y-%m-%d) 每日新闻 + AI 研究"
            git push
          fi

      - name: Purge jsDelivr cache
        if: steps.guard.outputs.skip != 'true'
        run: |
          for p in docs/feed.xml docs/latest.md docs/latest.json; do
            curl -s -m 20 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$p" > /dev/null && echo "purged $p" || true
          done
