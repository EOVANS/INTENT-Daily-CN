name: Daily Feed Build

on:
  schedule:
    # 23:35 UTC = 07:35 Asia/Shanghai (next day)
    - cron: "35 23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        env:
          NEWS_WINDOW_HOURS: "26"
          AI_WINDOW_HOURS: "504"
          NEWS_TOP_N: "8"
          AI_TOP_N: "5"
        run: python scripts/build_feed.py

      - name: Commit generated feed
        run: |
          git config user.name "INTENT Daily CN Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs archive
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "feed: $(TZ=Asia/Shanghai date +%Y-%m-%d) 每日要闻 + AI 研究"
            git push
          fi
